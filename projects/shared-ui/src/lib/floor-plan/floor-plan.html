<div class="floor-plan">
  <div class="floor-plan-toolbar">
    <ng-container *ngIf="!controlsDisabled">
      <button
        type="button"
        class="tool-btn"
        [class.is-active]="isDrawing"
        title="Draw zone (click to place points, double-click to finish)"
        (click)="toggleDraw()"
      >
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
        </svg>
      </button>

      <select
        class="tool-zonetype-select"
        title="Zone type"
        [ngModel]="selectedZone?.zoneType ?? drawZoneType"
        (ngModelChange)="setZoneType($any($event))"
      >
        <option *ngFor="let t of zoneTypeOptions" [value]="t.value">{{ t.label }}</option>
      </select>

      <label class="tool-btn color-tool-btn" title="Zone color">
        <input
          type="color"
          [value]="selectedZone?.color ?? drawColor"
          (input)="setColor($any($event.target).value)"
        />
      </label>

      <button
        type="button"
        class="tool-btn"
        title="Delete selected zone"
        [disabled]="!selectedZoneId"
        (click)="deleteSelectedZone()"
      >
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
        </svg>
      </button>
    </ng-container>

    <button
      type="button"
      class="tool-btn"
      title="Back to previous view"
      *ngIf="hasPreviousView"
      (click)="goToPreviousView()"
    >
      <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"></path>
        <path d="M12 19l-7-7 7-7"></path>
      </svg>
    </button>

    <button type="button" class="tool-btn tool-btn--zoom-in" title="Zoom in" [disabled]="zoomLevel >= maxZoom" (click)="zoomIn()">+</button>
    <button type="button" class="tool-btn tool-btn--zoom-out" title="Zoom out" [disabled]="zoomLevel <= minZoom" (click)="zoomOut()">&minus;</button>
    <button
      type="button"
      class="tool-btn tool-btn--fullscreen"
      [title]="isFullscreen ? 'Exit full screen' : 'Full screen'"
      (click)="toggleFullscreen()"
    >
      <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <ng-container *ngIf="!isFullscreen; else exitFullscreenIcon">
          <path d="M3 8V5a2 2 0 0 1 2-2h3"></path>
          <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
          <path d="M21 16v3a2 2 0 0 1-2 2h-3"></path>
          <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
        </ng-container>
        <ng-template #exitFullscreenIcon>
          <path d="M8 3v3a2 2 0 0 1-2 2H3"></path>
          <path d="M21 8h-3a2 2 0 0 1-2-2V3"></path>
          <path d="M3 16h3a2 2 0 0 1 2 2v3"></path>
          <path d="M16 21v-3a2 2 0 0 1 2-2h3"></path>
        </ng-template>
      </svg>
    </button>

    <div class="tool-btn-wrap">
      <button
        type="button"
        class="tool-btn"
        [title]="selectedZoneId ? 'Selected zone opacity' : 'Floor plan image opacity'"
        (click)="toggleOpacitySlider()"
      >
        <svg class="tool-opacity-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
        </svg>
      </button>
      <div class="tool-popover opacity-popover" *ngIf="showOpacitySlider">
        <input
          type="range"
          class="opacity-slider"
          min="0.1"
          max="1"
          step="0.05"
          [value]="selectedZone?.opacity ?? imageOpacity"
          (input)="setOpacity($any($event.target).valueAsNumber)"
        />
      </div>
    </div>
  </div>

  <div
    #floorPlanCanvas
    class="floor-plan-canvas"
    [class.is-drawing]="isDrawing"
    [class.is-pannable]="canPan"
    [class.is-panning]="isPanning"
    (mousedown)="startPan($event)"
    (click)="onFloorPlanClick($event)"
    (dblclick)="onFloorPlanDblClick($event)"
  >
    <div
      class="floor-plan-zoom-layer"
      [class.no-transition]="isPanning"
      [style.transform]="'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoomLevel + ')'"
    >
      <img [src]="image" alt="Floor plan" class="floor-plan-image" [style.opacity]="imageOpacity" />

      <svg class="floor-plan-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polygon
          *ngFor="let zone of drawnZones"
          [attr.points]="polygonPoints(zone)"
          [attr.fill]="zone.color"
          [attr.fill-opacity]="zone.opacity"
          [attr.stroke]="zone.color"
          stroke-width="0.5"
          vector-effect="non-scaling-stroke"
          [class.is-selected]="zone.id === selectedZoneId"
          (click)="addAssetAt(zone, $event)"
        ></polygon>

        <polygon
          *ngIf="drawingPoints.length > 1"
          [attr.points]="drawingPreviewPoints"
          [attr.fill]="drawColor"
          fill-opacity="0.25"
          [attr.stroke]="drawColor"
          stroke-width="0.5"
          stroke-dasharray="1.5"
          vector-effect="non-scaling-stroke"
        ></polygon>

        <circle
          *ngFor="let p of drawingPoints; let i = index"
          [attr.cx]="p.x"
          [attr.cy]="p.y"
          [attr.r]="i === 0 && drawingPoints.length > 2 ? 1.4 : 0.8"
          [attr.fill]="i === 0 && drawingPoints.length > 2 ? '#fff' : drawColor"
          [attr.stroke]="drawColor"
          [attr.stroke-width]="i === 0 && drawingPoints.length > 2 ? 0.6 : 0"
        ></circle>
      </svg>

      <div
        class="floor-plan-pin"
        *ngFor="let pin of floorPlanPins"
        [style.left.%]="pin.left"
        [style.top.%]="pin.top"
        [title]="pin.label"
      >
        <span class="floor-plan-pin-dot" [style.background]="pin.color"></span>
        <span class="floor-plan-pin-label">{{ pin.label }}</span>
      </div>

      <button
        type="button"
        class="zone-asset-label"
        *ngFor="let zone of drawnZones"
        [class.is-clickable]="zone.assets.length"
        [style.left.%]="centroidX(zone)"
        [style.top.%]="centroidY(zone)"
        [title]="zone.assets.length ? 'View all assets in this zone' : ''"
        (click)="onAssetsSummaryClick(zone, $event)"
        (mousedown)="$event.stopPropagation()"
      >{{ assetLabel }}: {{ zone.assets.length }}</button>

      <button
        type="button"
        class="zone-asset-pin"
        [class.is-highlighted]="entry.asset.id === highlightedAssetId"
        *ngFor="let entry of zonePins"
        [style.left.%]="entry.asset.x"
        [style.top.%]="entry.asset.y"
        [style.background]="entry.zone.color"
        title="View asset details"
        (click)="onAssetPinClick(entry.zone, entry.asset, $event)"
        (mousedown)="$event.stopPropagation()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8 8a2 2 0 0 0 2.828 0l7.172-7.172a2 2 0 0 0 0-2.828z"></path>
          <circle cx="7.5" cy="7.5" r="1.4" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>
    </div>
  </div>

  <p class="floor-plan-hint" *ngIf="isDrawing">
    Click to place each corner — 3 points for a triangle, 4 for a square, or keep going for any shape.
    Click the highlighted first point again (or double-click) to close it.
  </p>
  <p class="floor-plan-hint" *ngIf="!isDrawing && drawnZones.length">
    Click inside a drawn zone to drop an asset icon there — one click, one icon. Click an icon to view its details.
  </p>
</div>
